name: "Setup cosign"
description: "Downloads and installs sigstore/cosign with mandatory release signature verification (Linux/macOS only)"
author: "rsclarke"
branding:
  icon: "shield"
  color: "blue"

inputs:
  version:
    description: "Version of sigstore/cosign to install (e.g., v3.0.6). If not specified, the latest release will be used."
    required: false
    default: ""
  use-cache:
    description: "Whether to restore and save the GitHub Actions cache for the cosign tool cache."
    required: false
    default: "true"

outputs:
  cosign_path:
    description: "Path to the installed cosign binary"
    value: ${{ steps.resolve-install-dir.outputs.binary-path }}

runs:
  using: "composite"
  steps:
    - name: Resolve version
      id: resolve-version
      shell: bash
      run: |
        if [[ -n "${{ inputs.version }}" ]]; then
          COSIGN_VERSION="${{ inputs.version }}"
        else
          echo "No version specified, fetching latest release..."

          LATEST_RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sigstore/cosign/releases/latest)

          COSIGN_VERSION=$(echo "${LATEST_RELEASE}" | jq -r '.tag_name')

          if [[ -z "${COSIGN_VERSION}" || "${COSIGN_VERSION}" == "null" ]]; then
            echo "Failed to resolve latest cosign release version"
            exit 1
          fi
        fi

        if [[ "${COSIGN_VERSION}" != v* ]]; then
          COSIGN_VERSION="v${COSIGN_VERSION}"
        fi

        echo "Resolved cosign version: ${COSIGN_VERSION}"
        echo "version=${COSIGN_VERSION}" >> "$GITHUB_OUTPUT"
        echo "version-without-v=${COSIGN_VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Restore tool cache
      if: inputs.use-cache == 'true'
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: |
          ${{ runner.tool_cache }}/cosign
        key: setup-cosign-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-version.outputs.version }}

    - name: Resolve install directory
      id: resolve-install-dir
      shell: bash
      run: |
        case "$RUNNER_OS" in
          macOS) OS="darwin" ;;
          Linux) OS="linux" ;;
          *)
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH" in
          X64) ARCH="amd64" ;;
          ARM64) ARCH="arm64" ;;
          *)
            echo "Unsupported architecture: $RUNNER_ARCH"
            exit 1
            ;;
        esac

        VERSION_WITHOUT_V="${{ steps.resolve-version.outputs.version-without-v }}"
        INSTALL_DIR="${RUNNER_TOOL_CACHE}/cosign/${VERSION_WITHOUT_V}/${ARCH}"
        BINARY_PATH="${INSTALL_DIR}/cosign"
        COMPLETE_MARKER="${RUNNER_TOOL_CACHE}/cosign/${VERSION_WITHOUT_V}/${ARCH}.complete"
        ASSET_NAME="cosign-${OS}-${ARCH}"

        echo "os=${OS}" >> "$GITHUB_OUTPUT"
        echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
        echo "install-dir=${INSTALL_DIR}" >> "$GITHUB_OUTPUT"
        echo "binary-path=${BINARY_PATH}" >> "$GITHUB_OUTPUT"
        echo "complete-marker=${COMPLETE_MARKER}" >> "$GITHUB_OUTPUT"
        echo "asset-name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

    - name: Check for cached cosign
      id: check-cosign
      if: inputs.use-cache == 'true'
      shell: bash
      run: |
        INSTALL_DIR="${{ steps.resolve-install-dir.outputs.install-dir }}"
        BINARY_PATH="${{ steps.resolve-install-dir.outputs.binary-path }}"
        COMPLETE_MARKER="${{ steps.resolve-install-dir.outputs.complete-marker }}"

        if [[ -f "${COMPLETE_MARKER}" && -f "${BINARY_PATH}" && -x "${BINARY_PATH}" ]]; then
          echo "Found cached cosign at ${INSTALL_DIR}"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "No cached cosign found"
          echo "found=false" >> "$GITHUB_OUTPUT"
          mkdir -p "${INSTALL_DIR}"
        fi

    - name: Download and verify cosign
      if: inputs.use-cache != 'true' || steps.check-cosign.outputs.found != 'true'
      shell: bash
      run: |
        COSIGN_VERSION="${{ steps.resolve-version.outputs.version }}"
        INSTALL_DIR="${{ steps.resolve-install-dir.outputs.install-dir }}"
        BINARY_PATH="${{ steps.resolve-install-dir.outputs.binary-path }}"
        COMPLETE_MARKER="${{ steps.resolve-install-dir.outputs.complete-marker }}"
        ASSET_NAME="${{ steps.resolve-install-dir.outputs.asset-name }}"
        RELEASE_URL="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
        TEMP_DIR=$(mktemp -d)

        cleanup() {
          rm -rf "${TEMP_DIR}"
        }
        trap cleanup EXIT

        mkdir -p "${INSTALL_DIR}"

        EXPECTED_KEY_PATH="${TEMP_DIR}/expected-release-cosign.pub"
        DOWNLOADED_KEY_PATH="${TEMP_DIR}/release-cosign.pub"
        DOWNLOADED_BINARY_PATH="${TEMP_DIR}/cosign"
        BUNDLE_PATH="${TEMP_DIR}/${ASSET_NAME}-kms.sigstore.json"
        SIGNATURE_PATH="${TEMP_DIR}/${ASSET_NAME}.sig"

        # This key is expected to stay stable across releases and only change if
        # sigstore rotates the cosign artifact signing key.
        cat > "${EXPECTED_KEY_PATH}" <<'EOF'
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEhyQCx0E9wQWSFI9ULGwy3BuRklnt
        IqozONbbdbqz11hlRJy9c7SG+hdcFl9jE9uE/dwtuwU2MqU9T/cN0YkWww==
        -----END PUBLIC KEY-----
        EOF

        echo "Downloading ${ASSET_NAME} and release verification material..."
        curl --retry 3 -fsSL "${RELEASE_URL}/${ASSET_NAME}" -o "${DOWNLOADED_BINARY_PATH}"
        curl --retry 3 -fsSL "${RELEASE_URL}/${ASSET_NAME}-kms.sigstore.json" -o "${BUNDLE_PATH}"
        curl --retry 3 -fsSL "${RELEASE_URL}/release-cosign.pub" -o "${DOWNLOADED_KEY_PATH}"

        if [[ "$(cat "${EXPECTED_KEY_PATH}")" != "$(cat "${DOWNLOADED_KEY_PATH}")" ]]; then
          echo "release-cosign.pub did not match the pinned expected key"
          exit 1
        fi

        jq -r '.messageSignature.signature' "${BUNDLE_PATH}" | openssl base64 -d -A -out "${SIGNATURE_PATH}"

        openssl dgst -sha256 \
          -verify "${DOWNLOADED_KEY_PATH}" \
          -signature "${SIGNATURE_PATH}" \
          "${DOWNLOADED_BINARY_PATH}"

        chmod +x "${DOWNLOADED_BINARY_PATH}"
        mv "${DOWNLOADED_BINARY_PATH}" "${BINARY_PATH}"
        touch "${COMPLETE_MARKER}"

        echo "Installed cosign ${COSIGN_VERSION} to ${INSTALL_DIR}"

    - name: Add cosign to PATH
      shell: bash
      run: |
        echo "${{ steps.resolve-install-dir.outputs.install-dir }}" >> "$GITHUB_PATH"

    - name: Verify cosign installation
      shell: bash
      run: |
        echo "cosign installed at: ${{ steps.resolve-install-dir.outputs.binary-path }}"
        "${{ steps.resolve-install-dir.outputs.binary-path }}" version
