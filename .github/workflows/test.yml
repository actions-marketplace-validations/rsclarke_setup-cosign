name: Test setup-cosign
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Cached install (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install cosign
        uses: ./
      - name: Verify cosign
        run: |
          which cosign
          cosign version

  test-cache-miss:
    name: Forced cache miss (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install cosign
        uses: ./
        with:
          use-cache: "false"
      - name: Verify cosign
        run: |
          which cosign
          cosign version
