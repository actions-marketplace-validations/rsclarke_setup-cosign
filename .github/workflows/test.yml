name: Test setup-cosign
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Cached install (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cosign
        uses: ./
      - name: Verify cosign
        run: |
          which cosign
          cosign version

  test-cache-miss:
    name: Forced cache miss (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install cosign
        uses: ./
        with:
          use-cache: "false"
      - name: Verify cosign
        run: |
          which cosign
          cosign version
